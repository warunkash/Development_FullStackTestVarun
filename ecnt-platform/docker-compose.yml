version: '3.9'

networks:
  ecnt-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

services:
  # ============================================================
  # Infrastructure Services
  # ============================================================
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: ecnt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecnt_db
      POSTGRES_USER: ${DATABASE_USER:-ecnt_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./libs/database/src/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    networks:
      - ecnt-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-ecnt_user} -d ecnt_db']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ecnt-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - ecnt-network
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Application Services
  # ============================================================
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    container_name: ecnt-api-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      CHARGING_SERVICE_URL: http://charging-service:3003
      OCPP_SERVICE_URL: http://ocpp-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      ANALYTICS_SERVICE_URL: http://analytics-service:3006
      BILLING_SERVICE_URL: http://billing-service:3007
      FLEET_SERVICE_URL: http://fleet-service:3008
      FRANCHISE_SERVICE_URL: http://franchise-service:3009
      NOTIFICATION_SERVICE_URL: http://notification-service:3010
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ecnt-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  auth-service:
    build:
      context: ./apps/auth-service
      dockerfile: Dockerfile
    container_name: ecnt-auth-service
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ecnt_db
      DATABASE_USER: ${DATABASE_USER:-ecnt_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@ecnt.in}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-10}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecnt-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3

  user-service:
    build:
      context: ./apps/user-service
      dockerfile: Dockerfile
    container_name: ecnt-user-service
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ecnt_db
      DATABASE_USER: ${DATABASE_USER:-ecnt_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-ecnt-uploads}
      AWS_CLOUDFRONT_URL: ${AWS_CLOUDFRONT_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecnt-network

  charging-service:
    build:
      context: ./apps/charging-service
      dockerfile: Dockerfile
    container_name: ecnt-charging-service
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ecnt_db
      DATABASE_USER: ${DATABASE_USER:-ecnt_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OCPP_SERVICE_URL: http://ocpp-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3010
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecnt-network

  ocpp-service:
    build:
      context: ./apps/ocpp-service
      dockerfile: Dockerfile
    container_name: ecnt-ocpp-service
    restart: unless-stopped
    ports:
      - '3004:3004'
      - '9000:9000'
    environment:
      NODE_ENV: production
      PORT: 3004
      WS_PORT: 9000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ecnt_db
      DATABASE_USER: ${DATABASE_USER:-ecnt_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CHARGING_SERVICE_URL: http://charging-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3010
      OCPP_HEARTBEAT_INTERVAL: ${OCPP_HEARTBEAT_INTERVAL:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecnt-network

  payment-service:
    build:
      context: ./apps/payment-service
      dockerfile: Dockerfile
    container_name: ecnt-payment-service
    restart: unless-stopped
    ports:
      - '3005:3005'
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ecnt_db
      DATABASE_USER: ${DATABASE_USER:-ecnt_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NOTIFICATION_SERVICE_URL: http://notification-service:3010
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecnt-network

  analytics-service:
    build:
      context: ./apps/analytics-service
      dockerfile: Dockerfile
    container_name: ecnt-analytics-service
    restart: unless-stopped
    ports:
      - '3006:3006'
    environment:
      NODE_ENV: production
      PORT: 3006
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ecnt_db
      DATABASE_USER: ${DATABASE_USER:-ecnt_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecnt-network

  billing-service:
    build:
      context: ./apps/billing-service
      dockerfile: Dockerfile
    container_name: ecnt-billing-service
    restart: unless-stopped
    ports:
      - '3007:3007'
    environment:
      NODE_ENV: production
      PORT: 3007
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ecnt_db
      DATABASE_USER: ${DATABASE_USER:-ecnt_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PAYMENT_SERVICE_URL: http://payment-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3010
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-ecnt-uploads}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecnt-network

  fleet-service:
    build:
      context: ./apps/fleet-service
      dockerfile: Dockerfile
    container_name: ecnt-fleet-service
    restart: unless-stopped
    ports:
      - '3008:3008'
    environment:
      NODE_ENV: production
      PORT: 3008
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ecnt_db
      DATABASE_USER: ${DATABASE_USER:-ecnt_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BILLING_SERVICE_URL: http://billing-service:3007
      NOTIFICATION_SERVICE_URL: http://notification-service:3010
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecnt-network

  franchise-service:
    build:
      context: ./apps/franchise-service
      dockerfile: Dockerfile
    container_name: ecnt-franchise-service
    restart: unless-stopped
    ports:
      - '3009:3009'
    environment:
      NODE_ENV: production
      PORT: 3009
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ecnt_db
      DATABASE_USER: ${DATABASE_USER:-ecnt_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BILLING_SERVICE_URL: http://billing-service:3007
      ANALYTICS_SERVICE_URL: http://analytics-service:3006
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecnt-network

  notification-service:
    build:
      context: ./apps/notification-service
      dockerfile: Dockerfile
    container_name: ecnt-notification-service
    restart: unless-stopped
    ports:
      - '3010:3010'
    environment:
      NODE_ENV: production
      PORT: 3010
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ecnt_db
      DATABASE_USER: ${DATABASE_USER:-ecnt_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@ecnt.in}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-ECNT Platform}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ecnt-network

  admin-portal:
    build:
      context: ./apps/admin-portal
      dockerfile: Dockerfile
    container_name: ecnt-admin-portal
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      API_GATEWAY_URL: http://api-gateway:3000
    depends_on:
      - api-gateway
    networks:
      - ecnt-network

  # ============================================================
  # Monitoring
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ecnt-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - ecnt-network

  grafana:
    image: grafana/grafana:latest
    container_name: ecnt-grafana
    restart: unless-stopped
    ports:
      - '3030:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - ecnt-network
