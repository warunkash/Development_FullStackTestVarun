version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecnt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ecntpassword
      POSTGRES_MULTIPLE_DATABASES: ecnt_auth,ecnt_users
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecnt-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./apps/auth-service
      dockerfile: Dockerfile
    container_name: ecnt-auth-service
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: ecnt_auth
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: ./apps/user-service
      dockerfile: Dockerfile
    container_name: ecnt-user-service
    env_file:
      - .env
    environment:
      PORT: 3002
      DATABASE_HOST: postgres
      DATABASE_NAME: ecnt_users
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
