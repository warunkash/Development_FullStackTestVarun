<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warangal Citizen Portal</title>
<meta name="description" content="One place for every government website useful to citizens of Warangal and Hanumakonda.">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1d2433;--mut:#5c667a;--acc:#9a3412;--line:#e6dfd3;--local:#166534;--state:#1d4ed8;--central:#7c3aed}
@media(prefers-color-scheme:dark){:root{--bg:#14110f;--card:#1e1a17;--ink:#f3ede4;--mut:#a9a094;--acc:#fb923c;--line:#352f29;--local:#4ade80;--state:#60a5fa;--central:#c4b5fd}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
header{padding:32px 16px 20px;max-width:1100px;margin:auto}h1{margin:0 0 4px;font-size:clamp(1.6rem,4vw,2.4rem)}h1 span{color:var(--acc)}
header p{margin:0;color:var(--mut)}main{max-width:1100px;margin:auto;padding:0 16px 48px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}input{flex:1 1 240px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
button.chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
button.chip[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
h2{font-size:1.1rem;margin:28px 0 10px;color:var(--acc)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
a.card{display:block;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--acc);outline:none;box-shadow:0 2px 10px #0002}
.card b{display:block}.card small{color:var(--mut);display:block;margin:4px 0 8px}.tag{font-size:.75rem;font-weight:600;text-transform:uppercase}
.local{color:var(--local)}.state{color:var(--state)}.central{color:var(--central)}
footer{max-width:1100px;margin:auto;padding:0 16px 32px;color:var(--mut);font-size:.85rem}#none{display:none;color:var(--mut);padding:24px 0}
</style></head><body>
<header><h1><span>Warangal</span> Citizen Portal</h1><p>Local, Telangana and Government of India websites for residents of Warangal &amp; Hanumakonda — in one place.</p></header>
<main>
<div class="bar"><input id="q" type="search" placeholder="Search services, e.g. property tax, ration card, passport…" aria-label="Search">
<div id="lv" role="group" aria-label="Level"></div></div>
<div id="out"></div><p id="none">No matching sites.</p>
</main>
<footer>Unofficial directory; not run by any government body. Links open the official sites — verify before entering personal data.</footer>
<script src="data.js"></script>
<script>
const LV=[["all","All"],["local","Warangal"],["state","Telangana"],["central","India"]],LN={local:"Warangal",state:"Telangana",central:"India"};
let lv="all";const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("#lv").style.display="flex";$("#lv").style.gap="8px";$("#lv").style.flexWrap="wrap";
$("#lv").innerHTML=LV.map(([k,t])=>`<button class="chip" data-k="${k}" aria-pressed="${k===lv}">${t}</button>`).join("");
$("#lv").onclick=e=>{const k=e.target.dataset.k;if(!k)return;lv=k;document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));render()};
$("#q").oninput=render;
function render(){const q=$("#q").value.trim().toLowerCase(),g={};
SITES.filter(s=>(lv==="all"||s.l===lv)&&(!q||(s.n+s.d+s.c).toLowerCase().includes(q))).forEach(s=>(g[s.c]=g[s.c]||[]).push(s));
$("#out").innerHTML=Object.entries(g).map(([c,a])=>`<h2>${esc(c)}</h2><div class="grid">${a.map(s=>`<a class="card" href="${esc(s.u)}" target="_blank" rel="noopener noreferrer"><span class="tag ${s.l}">${LN[s.l]}</span><b>${esc(s.n)}</b><small>${esc(s.d)}</small></a>`).join("")}</div>`).join("");
$("#none").style.display=Object.keys(g).length?"none":"block"}
render();
</script></body></html>
