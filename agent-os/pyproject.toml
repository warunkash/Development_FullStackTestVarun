[project]
name = "agent-os"
version = "0.1.0"
description = "The layer underneath your agents: memory, tool registry, scoped permissions, traces, budgets, kill switch."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
