apiVersion: apps/v1
kind: Deployment
metadata:
  name: mentorios-worker-video
  namespace: mentorios-prod
  labels:
    app: mentorios-worker-video
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mentorios-worker-video
  template:
    metadata:
      labels:
        app: mentorios-worker-video
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4  # GPU node pool
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: worker-video
        image: mentorios/worker:latest
        command: ["celery", "-A", "workers.celery_app", "worker",
                  "-Q", "video", "-c", "1", "--loglevel=info"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mentorios-secrets
              key: database-url
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: mentorios-secrets
              key: celery-broker-url
        - name: DEVICE
          value: "cuda"
        resources:
          requests:
            memory: "8Gi"
            cpu: "4000m"
            nvidia.com/gpu: "1"
          limits:
            memory: "16Gi"
            cpu: "8000m"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: temp-storage
          mountPath: /tmp/mentorios
      volumes:
      - name: temp-storage
        emptyDir:
          sizeLimit: 50Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mentorios-worker-wisdom
  namespace: mentorios-prod
  labels:
    app: mentorios-worker-wisdom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mentorios-worker-wisdom
  template:
    metadata:
      labels:
        app: mentorios-worker-wisdom
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: worker-wisdom
        image: mentorios/worker:latest
        command: ["celery", "-A", "workers.celery_app", "worker",
                  "-Q", "wisdom,embed", "-c", "1", "--loglevel=info"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mentorios-secrets
              key: database-url
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: mentorios-secrets
              key: celery-broker-url
        - name: VLLM_BASE_URL
          value: "http://vllm-service:8100"
        - name: DEVICE
          value: "cuda"
        resources:
          requests:
            memory: "16Gi"
            cpu: "8000m"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "16000m"
            nvidia.com/gpu: "1"
