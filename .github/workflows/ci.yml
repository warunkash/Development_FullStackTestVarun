name: MentorOS CI/CD

on:
  push:
    branches: [main, master, develop, "claude/**"]
  pull_request:
    branches: [main, master, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/mentorios

jobs:
  # ── Backend Tests ──────────────────────────────────────────
  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mentorios_test
          POSTGRES_USER: mentorios
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: mentorios/apps/api/requirements-ci.txt

    - name: Install API dependencies
      working-directory: mentorios/apps/api
      run: |
        pip install --upgrade pip
        pip install -r requirements-ci.txt

    - name: Lint
      working-directory: mentorios/apps/api
      run: |
        ruff check .
        black --check .

    - name: Type check
      working-directory: mentorios/apps/api
      run: mypy . --ignore-missing-imports

    - name: Run tests
      working-directory: mentorios/apps/api
      env:
        DATABASE_URL: postgresql+asyncpg://mentorios:test_pass@localhost:5432/mentorios_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test_secret_key_for_ci_minimum_32_chars
        ENVIRONMENT: development
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: test
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing \
          --ignore=tests/e2e -x

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./mentorios/apps/api/coverage.xml
        flags: api

  # ── Frontend Tests ─────────────────────────────────────────
  test-web:
    name: Web Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: mentorios/apps/web/package-lock.json

    - name: Install dependencies
      working-directory: mentorios/apps/web
      run: npm ci

    - name: Type check
      working-directory: mentorios/apps/web
      run: npm run type-check

    - name: Lint
      working-directory: mentorios/apps/web
      run: npm run lint

    - name: Build
      working-directory: mentorios/apps/web
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  # ── Security Scan ─────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scan
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        scan-type: "fs"
        scan-ref: "."
        format: "sarif"
        output: "trivy-results.sarif"
        severity: "CRITICAL,HIGH"

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: "trivy-results.sarif"

  # ── Build & Push ───────────────────────────────────────────
  build-and-push:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push API
      uses: docker/build-push-action@v6
      with:
        context: ./mentorios/apps/api
        file: ./mentorios/infrastructure/docker/api/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Web
      uses: docker/build-push-action@v6
      with:
        context: ./mentorios/apps/web
        file: ./mentorios/infrastructure/docker/web/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ── Deploy to Staging ──────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to staging cluster
      run: |
        echo "Deploy to staging — configure kubectl here"
        echo "kubectl set image deployment/mentorios-api api=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}"
