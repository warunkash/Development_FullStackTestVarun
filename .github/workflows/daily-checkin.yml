name: Daily Activity Check-in

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-in:
    runs-on: ubuntu-latest
    steps:
      - name: Post GitHub issue comment
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const timeStr = now.toLocaleString('en-US', {
              timeZone: 'UTC',
              hour: '2-digit',
              minute: '2-digit',
              hour12: false,
              month: 'short',
              day: 'numeric'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3,
              body: `## Hey! What are you working on? ⏰\n**Time:** ${timeStr} UTC\n\nGive a quick update on your current activity — reply to this comment!`
            });

      - name: Send WhatsApp notification via Zapier
        env:
          ZAPIER_NLA_API_KEY: ${{ secrets.ZAPIER_NLA_API_KEY }}
        run: |
          curl -s -X POST \
            "https://nla.zapier.com/api/v1/dynamic/exposed/7bfbc151-0e27-4b3e-ae5a-a24406c9e4f9/execute/" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${ZAPIER_NLA_API_KEY}" \
            -d '{
              "instructions": "Send a 5-minute activity check-in reminder",
              "params": {
                "template": "calendar_reminder",
                "event_name": "5-Min Check-in",
                "event_description": "Hey Varun! What are you working on right now? Reply on WhatsApp or GitHub Issue #3."
              }
            }'
