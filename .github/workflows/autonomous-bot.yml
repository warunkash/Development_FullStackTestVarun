name: autonomous-bot

# The same bot runs two ways. This workflow is the scheduled/one-shot host:
# it runs a single task and exits. For a continuous host, run `autobot serve`
# as a long-running process instead (see autonomous-bot/README.md).

on:
  schedule:
    # Every 6 hours. GitHub queues cron runs on shared runners, so treat the
    # time as approximate.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: Task name from autonomous-bot/autobot.yaml
        required: true
        default: heartbeat
      policy:
        description: Which brain picks the actions
        required: true
        default: rule
        type: choice
        options: [rule, claude]
  push:
    paths:
      - "autonomous-bot/**"
      - ".github/workflows/autonomous-bot.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: autonomous-bot

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -q

  run-bot:
    name: run task
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check configuration
        env:
          AUTOBOT_POLICY: ${{ inputs.policy || 'rule' }}
        run: python -m autobot.cli doctor

      - name: Run the task
        env:
          # The default policy needs no credentials, so scheduled runs work in a
          # fork with no secrets configured. Selecting the claude policy on a
          # manual run picks up the key if one is set.
          AUTOBOT_POLICY: ${{ inputs.policy || 'rule' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m autobot.cli run "${{ inputs.task || 'heartbeat' }}" --json

      - name: Upload run transcript
        # Upload the journal even when the run failed - that is when it matters.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobot-runs-${{ github.run_id }}
          path: autonomous-bot/runs/
          if-no-files-found: warn
          retention-days: 14
