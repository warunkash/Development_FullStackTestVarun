name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "playearn/**"
      - "ballsort/**"
      - "highway-aid/**"
      - "warangal-portal/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site (PlayEarn at root, Ball Sort at /ballsort/, Highway Aid at /highway-aid/, Warangal Portal at /warangal-portal/)
        run: |
          mkdir -p _site/ballsort
          cp -r playearn/. _site/
          cp -r ballsort/. _site/ballsort/
          mkdir -p _site/highway-aid
          cp -r highway-aid/. _site/highway-aid/
          mkdir -p _site/warangal-portal
          cp -r warangal-portal/. _site/warangal-portal/
          rm -f _site/warangal-portal/check-links.js _site/warangal-portal/README.md
          rm -rf _site/ballsort/backend _site/ballsort/tests
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
