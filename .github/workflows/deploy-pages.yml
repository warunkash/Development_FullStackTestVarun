name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "playearn/**"
      - "ballsort/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site (PlayEarn at root, Ball Sort at /ballsort/)
        run: |
          mkdir -p _site/ballsort
          cp -r playearn/. _site/
          cp -r ballsort/. _site/ballsort/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
