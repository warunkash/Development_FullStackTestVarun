<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script>
  try { var t = localStorage.getItem('ballsortTheme');
        if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t; } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<title>Ball Sort Color Puzzle</title>
<style>
  :root { --bg1:#0b1a3a; --bg2:#050b1c; --glass:rgba(255,255,255,.08); --edge:rgba(255,255,255,.75); --txt:#fff;
          --card:#12244d; --tube-a:rgba(255,255,255,.14); --tube-b:rgba(255,255,255,.03); --overlay:#000a; --done:#7CFC9A; color-scheme:dark; }
  :root[data-theme=light] { --bg1:#f4f8ff; --bg2:#c9d8f2; --glass:rgba(20,40,90,.07); --edge:rgba(20,40,90,.55); --txt:#14213d;
          --card:#fff; --tube-a:rgba(255,255,255,.95); --tube-b:rgba(20,40,90,.06); --overlay:rgba(20,30,60,.5); --done:#1faa59; color-scheme:light; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { height:100%; margin:0; }
  body { background:radial-gradient(ellipse at 50% 30%, var(--bg1), var(--bg2)); color:var(--txt);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; align-items:center; overflow:hidden; }
  header { width:100%; max-width:640px; display:flex; align-items:center; justify-content:space-between; padding:14px 16px; }
  h1 { font-size:1.4rem; margin:0; letter-spacing:.5px; }
  .moves { font-size:.8rem; opacity:.65; text-align:center; }
  .round { width:44px; height:44px; border-radius:50%; border:2px solid var(--edge); background:var(--glass); color:var(--txt);
           display:grid; place-items:center; font-size:1.2rem; cursor:pointer; position:relative; transition:transform .1s; }
  .round:active { transform:scale(.92); }
  .badge { position:absolute; right:-4px; bottom:-4px; background:#e53935; border-radius:50%; width:18px; height:18px; font-size:.65rem; display:grid; place-items:center; }
  main { flex:1; width:100%; max-width:640px; display:flex; flex-wrap:wrap; justify-content:center; align-content:center; gap:44px 22px; padding:70px 12px 20px; }
  main.tall { gap:28px 10px; padding:32px 12px 4px; --u:36px; }
  main.tall .tube { width:44px; }
  .tube { width:clamp(44px,12vw,62px); height:calc(var(--cap) * var(--u, clamp(40px,11vw,56px)) + 16px); border:3px solid var(--edge); border-top-width:4px;
          border-radius:8px 8px 26px 26px; background:linear-gradient(90deg,var(--tube-a),var(--tube-b));
          display:flex; flex-direction:column-reverse; align-items:center; padding:6px 0 4px; position:relative; cursor:pointer; transition:transform .15s; }
  .tube.sel { transform:translateY(-4px); }
  .tube.hint-from { box-shadow:0 0 18px 4px #ffb300; border-color:#ffb300; }
  .tube.hint-to { box-shadow:0 0 18px 4px #4cd964; border-color:#4cd964; }
  .tube.hint-from::before, .tube.hint-to::before { position:absolute; top:-26px; left:50%; transform:translateX(-50%); font-size:.7rem; font-weight:800; letter-spacing:.5px;
          padding:2px 7px; border-radius:999px; color:#0b1a3a; white-space:nowrap; pointer-events:none; }
  .tube.hint-from::before { content:"FROM"; background:#ffb300; }
  .tube.hint-to::before { content:"TO"; background:#4cd964; }
  .tube.done { border-color:var(--done); }
  .ball { width:84%; aspect-ratio:1; border-radius:50%; flex:none; margin-top:2px; position:relative;
          background:radial-gradient(circle at 35% 30%, #fff9 0 12%, transparent 30%), radial-gradient(circle at 50% 50%, var(--c), var(--d)); box-shadow:0 2px 4px #0006; }
  .ball.lift { position:absolute; top:calc(-1 * clamp(44px,12vw,58px) - 8px); left:8%; width:84%; margin:0; animation:pop .15s ease-out; }
  @keyframes pop { from { transform:translateY(14px); } to { transform:none; } }
  footer { display:flex; gap:22px; padding:16px 16px 8px; }
  .link { background:none; border:0; color:var(--txt); opacity:.55; font-size:.8rem; text-decoration:underline; cursor:pointer; padding:6px 10px 22px; white-space:nowrap; }
  .link:hover { opacity:.9; }
  .modal { position:fixed; inset:0; background:var(--overlay); display:none; place-items:center; z-index:9; }
  .modal.show { display:grid; }
  .card { background:var(--card); color:var(--txt); border:2px solid var(--edge); border-radius:20px; padding:28px 36px; text-align:center; }
  h1[role=button] { cursor:pointer; }
  h1[role=button]::after { content:" \25BE"; font-size:.8em; opacity:.7; }
  .select-card { width:min(92vw,380px); padding:22px 18px; }
  .select-card h2 { font-size:1.4rem; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; max-height:52vh; overflow-y:auto; padding:2px; margin-bottom:16px; }
  .tile { aspect-ratio:1; border-radius:12px; border:2px solid var(--edge); background:var(--glass); color:var(--txt); font-size:1rem; font-weight:700;
          display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; padding:0; line-height:1.1; }
  .tile small { font-size:.6rem; font-weight:500; opacity:.75; }
  .tile.done { border-color:var(--done); }
  .tile.cur { background:#2e7dff; border-color:var(--txt); color:#fff; }
  .tile:disabled { opacity:.3; cursor:not-allowed; }
  .links { display:flex; gap:0; align-items:center; }
  .links span { opacity:.55; padding-bottom:16px; }
  .board-card { width:min(92vw,380px); padding:22px 18px; }
  .board-card h2 { font-size:1.4rem; }
  .board-card select { background:var(--glass); color:var(--txt); border:2px solid var(--edge); border-radius:10px; padding:6px 10px; font-size:.95rem; margin-bottom:12px; }
  .board-list { list-style:none; margin:0 0 16px; padding:0; text-align:left; max-height:44vh; overflow-y:auto; }
  .board-list li { display:grid; grid-template-columns:2rem 1fr auto; gap:8px; padding:8px 10px; border-radius:10px; font-size:.95rem; align-items:center; }
  .board-list li:nth-child(odd) { background:var(--glass); }
  .board-list li.me { outline:2px solid #2e7dff; }
  .board-list .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .board-list .sc { font-size:.8rem; opacity:.8; white-space:nowrap; }
  .board-empty { opacity:.7; padding:18px 0; }
  .tabs { display:flex; gap:8px; justify-content:center; margin-bottom:10px; }
  .tab { background:var(--glass); color:var(--txt); border:2px solid var(--edge); border-radius:999px; padding:6px 14px; font-weight:600; font-size:.9rem; cursor:pointer; }
  .tab.on { background:#2e7dff; border-color:#2e7dff; color:#fff; }
  .links.top .link { padding-bottom:4px; }
  .links.top span { padding-bottom:4px; }
  .row.special { margin-bottom:12px; row-gap:8px; }
  .row.special .btn { margin:0; }
  .btn.monthly { padding:9px 20px; font-size:.95rem; background:#d81b60; }
  .btn.yearly { padding:9px 20px; font-size:.95rem; background:#6a1b9a; }
  .btn.weekly { padding:9px 20px; font-size:.95rem; background:#7c4dff; }
  .btn.daily { margin:0 0 12px; padding:9px 20px; font-size:.95rem; background:#ff8f1f; }
  .name-row { margin:0 0 14px; }
  .name-row input { background:var(--glass); color:var(--txt); border:2px solid var(--edge); border-radius:10px; padding:8px 10px; font-size:1rem; width:70%; text-align:center; user-select:text; }
  .btn.alt { background:transparent; color:var(--txt); border:2px solid var(--edge); }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .hint-text { font-size:.9rem; opacity:.9; }
  .card h2 { margin:0 0 6px; font-size:1.8rem; } .card p { margin:0 0 18px; opacity:.8; }
  .btn { background:#2e7dff; color:#fff; border:0; border-radius:999px; padding:12px 28px; font-size:1rem; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<header>
  <button class="round" id="restart" title="Restart level">&#x21BB;</button>
  <div><h1 id="lvl" role="button" tabindex="0" title="Select level">Level 1</h1><div class="moves"><span id="moves">Moves: 0</span></div><div class="moves">&#x23F1; <span id="timer">0:00</span> &middot; Best: <span id="bestTime">&ndash;</span></div></div>
  <button class="round" id="menu" title="New random level">&#x23ED;</button>
</header>
<main id="board"></main>
<footer>
  <button class="round" id="addTube" title="Add an empty tube">+<span class="badge" id="addB">1</span></button>
  <button class="round" id="undo" title="Undo">&#x21B6;<span class="badge" id="undoB">5</span></button>
  <button class="round" id="hint" title="Hint">&#x1F4A1;<span class="badge" id="hintB">3</span></button>
  <button class="round" id="theme" title="Switch theme"></button>
  <button class="round" id="mute" title="Mute sound" aria-pressed="false">&#x1F50A;</button>
</footer>
<div class="links top"><button class="link" id="openDaily" title="Daily challenge">Daily</button><span aria-hidden="true">&middot;</span><button class="link" id="openWeekly" title="Weekly challenge">Weekly</button><span aria-hidden="true">&middot;</span><button class="link" id="openMonthly" title="Monthly challenge">Monthly</button><span aria-hidden="true">&middot;</span><button class="link" id="openYearly" title="Yearly challenge">Yearly</button></div>
<div class="links"><button class="link" id="openBoard">Leaderboard</button><span aria-hidden="true">&middot;</span><button class="link" id="resetBest">Reset best scores</button></div>
<div class="modal" id="select"><div class="card select-card"><h2>Select Level</h2><div class="row special"><button class="btn daily" id="dailyBtn">&#x1F4C5; Daily Challenge</button><button class="btn weekly" id="weeklyBtn">&#x1F5D3; Weekly Challenge</button><button class="btn monthly" id="monthlyBtn">&#x1F3C5; Monthly Challenge</button><button class="btn yearly" id="yearlyBtn">&#x1F3C6; Yearly Challenge</button></div><div class="grid" id="grid"></div><button class="btn" id="closeSelect">Close</button></div></div>
<div class="modal" id="win"><div class="card"><h2>&#x1F389; Level Complete!</h2><p id="winMsg"></p><p id="winTime" class="hint-text"></p><p id="nextHint" class="hint-text"></p><p id="rankMsg" class="hint-text"></p><p id="worldMsg" class="hint-text"></p><div class="name-row"><input id="playerName" maxlength="12" placeholder="Your name" autocomplete="off" aria-label="Your name"></div><div class="row"><button class="btn alt" id="viewBoard">Leaderboard</button><button class="btn alt" id="shareBtn" style="display:none">Share</button><button class="btn" id="next">Next Level</button></div></div></div>
<div class="modal" id="lbModal"><div class="card board-card"><h2>&#x1F3C6; Leaderboard</h2><div class="tabs" role="tablist"><button class="tab on" id="tabWorld" role="tab">&#x1F30D; World</button><button class="tab" id="tabLocal" role="tab">This device</button></div><select id="boardLevel" aria-label="Level"></select><ol class="board-list" id="boardList"></ol><div class="row"><button class="btn alt" id="clearBoard">Clear</button><button class="btn" id="closeBoard">Close</button></div></div></div>

<script>
let CAP = 4;
const capFor = lv => isYearly(lv) ? 6 : isMonthly(lv) ? 5 : 4;
const COLORS = [ ['#ff2d2d','#a30000'], ['#ff9a1f','#b25a00'], ['#ffd51f','#b38f00'], ['#2ecc40','#0b7a1d'], ['#2aa8ff','#0a5fa8'],
                 ['#b455ff','#6a1fb0'], ['#ff5fb3','#b0206f'], ['#19d3c5','#0a7c74'], ['#8d6e63','#4e342e'], ['#e0e0e0','#8a8a8a'] ];
const $ = id => document.getElementById(id);
let level = +(localStorage.getItem('ballsortLevel') || 1);
// Daily challenge: level numbers above DAILY_MIN are a date key (YYYYMMDD in UTC), the same board for everyone that day
const DAILY_MIN = 20000000, DAILY_COLORS = 8;
// Weekly challenge: keys from WEEKLY_MIN up are WEEKLY_MIN + the Monday (YYYYMMDD, UTC) of that week
const WEEKLY_MIN = 300000000, WEEKLY_COLORS = 10;
const isSpecial = lv => lv > DAILY_MIN;
// Monthly challenge: keys from MONTHLY_MIN up are MONTHLY_MIN + YYYYMM (UTC). The biggest board: 10 colors, 5 balls per color
const MONTHLY_MIN = 400000000, MONTHLY_COLORS = 10;
// Yearly challenge: keys from YEARLY_MIN up are YEARLY_MIN + YYYY (UTC). The marathon: 10 colors, 6 balls per color
const YEARLY_MIN = 500000000, YEARLY_COLORS = 10;
const isYearly = lv => lv >= YEARLY_MIN;
const isMonthly = lv => lv >= MONTHLY_MIN && lv < YEARLY_MIN;
const isWeekly = lv => lv >= WEEKLY_MIN && lv < MONTHLY_MIN;
const isDaily = lv => lv > DAILY_MIN && lv < WEEKLY_MIN;
const dailyKey = () => { const d = new Date(); return d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate(); };
const keyToDay = k => Math.floor(k / 10000) + '-' + String(Math.floor(k / 100) % 100).padStart(2, '0') + '-' + String(k % 100).padStart(2, '0');
const weekKey = () => {
  const d = new Date(), dow = (d.getUTCDay() + 6) % 7;
  const m = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - dow));
  return WEEKLY_MIN + m.getUTCFullYear() * 10000 + (m.getUTCMonth() + 1) * 100 + m.getUTCDate();
};
const weekLabel = k => {
  const a = new Date(keyToDay(k - WEEKLY_MIN) + 'T00:00:00Z'), b = new Date(a.getTime() + 6 * 86400000);
  const f = (d, o) => d.toLocaleDateString(undefined, Object.assign({ timeZone: 'UTC' }, o));
  return a.getUTCMonth() === b.getUTCMonth() ? f(a, { month: 'short' }) + ' ' + a.getUTCDate() + '\u2013' + b.getUTCDate()
                                              : f(a, { month: 'short', day: 'numeric' }) + '\u2013' + f(b, { month: 'short', day: 'numeric' });
};
const monthKey = () => { const d = new Date(); return MONTHLY_MIN + d.getUTCFullYear() * 100 + d.getUTCMonth() + 1; };
const monthDay = k => { const ym = k - MONTHLY_MIN; return Math.floor(ym / 100) + '-' + String(ym % 100).padStart(2, '0') + '-01'; };
const monthLabel = (k, year) => new Date(monthDay(k) + 'T00:00:00Z').toLocaleDateString(undefined, year ? { month: 'short', year: 'numeric', timeZone: 'UTC' } : { month: 'short', timeZone: 'UTC' });
const yearKey = () => YEARLY_MIN + new Date().getUTCFullYear();
const yearDay = k => (k - YEARLY_MIN) + '-01-01';
const specialInfo = lv => isYearly(lv)
  ? { name: 'Yearly', icon: '\u{1F3C6}', label: String(lv - YEARLY_MIN), shareLabel: String(lv - YEARLY_MIN), submit: 'submit_yearly_score', get: 'get_yearly_leaderboard', arg: 'p_year', date: yearDay(lv), when: 'this year', board: 'this year\'s board', done: 'ballsortYearlyDone' }
  : isMonthly(lv)
  ? { name: 'Monthly', icon: '\u{1F3C5}', label: monthLabel(lv), shareLabel: monthLabel(lv, true), submit: 'submit_monthly_score', get: 'get_monthly_leaderboard', arg: 'p_month', date: monthDay(lv), when: 'this month', board: 'this month\'s board', done: 'ballsortMonthlyDone' }
  : isWeekly(lv)
  ? { name: 'Weekly', icon: '\u{1F5D3}', label: weekLabel(lv), shareLabel: weekLabel(lv), submit: 'submit_weekly_score', get: 'get_weekly_leaderboard', arg: 'p_week', date: keyToDay(lv - WEEKLY_MIN), when: 'this week', board: 'this week\'s board', done: 'ballsortWeeklyDone' }
  : isDaily(lv)
  ? { name: 'Daily', icon: '\u{1F4C5}', label: dayLabel(lv), shareLabel: dayLabel(lv), submit: 'submit_daily_score', get: 'get_daily_leaderboard', arg: 'p_day', date: keyToDay(lv), when: 'today', board: 'today\'s daily board', done: 'ballsortDailyDone' }
  : null;
const dayLabel = k => new Date(keyToDay(k) + 'T00:00:00Z').toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });
let normalLevel = level;
// Daily streak: consecutive UTC days with the daily challenge completed (kept on this device)
let streak = { last: 0, count: 0, best: 0 };
try { streak = Object.assign(streak, JSON.parse(localStorage.getItem('ballsortStreak')) || {}); } catch (e) {}
const prevKey = k => { const d = new Date(Date.UTC(Math.floor(k / 10000), Math.floor(k / 100) % 100 - 1, k % 100) - 86400000); return d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate(); };
const currentStreak = () => { const t = dailyKey(); return streak.last === t || streak.last === prevKey(t) ? streak.count : 0; };
function recordDaily(k){
  if (k <= streak.last) return false;
  streak.count = streak.last === prevKey(k) ? streak.count + 1 : 1;
  streak.last = k;
  streak.best = Math.max(streak.best, streak.count);
  try { localStorage.setItem('ballsortStreak', JSON.stringify(streak)); } catch (e) {}
  return true;
}
function refreshDailyLabels(){
  const n = currentStreak();
  $('openDaily').textContent = 'Daily' + (n ? ' \u{1F525}' + n : '');
  $('openDaily').title = 'Daily challenge' + (n ? ' \u2013 ' + n + '-day streak' : '');
}
const setNormal = l => { normalLevel = level = l; try { localStorage.setItem('ballsortLevel', l); } catch (e) {} };
let unlocked = Math.max(level, +(localStorage.getItem('ballsortUnlocked') || 1)); // highest level reached
let best = {}; // level -> fewest moves
try { best = JSON.parse(localStorage.getItem('ballsortBest')) || {}; } catch (e) {}
let bestTime = {}; // level -> fastest time in ms
try { bestTime = JSON.parse(localStorage.getItem('ballsortBestTime')) || {}; } catch (e) {}
const saveBestTime = () => { try { localStorage.setItem('ballsortBestTime', JSON.stringify(bestTime)); } catch (e) {} };
const saveBest = () => { try { localStorage.setItem('ballsortBest', JSON.stringify(best)); } catch (e) {} };
let tubes, history, selected, moves, undos, hints, adds, hintMove = null;

// seeded RNG so a level is the same every time
function rng(seed){ return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }

function canMove(t, a, b){ // move from a to b
  if (a === b || !t[a].length || t[b].length >= CAP) return false;
  const top = t[a][t[a].length-1];
  if (t[b].length && t[b][t[b].length-1] !== top) return false;
  // pointless: moving a pure tube into an empty one
  if (!t[b].length && t[a].every(c => c === top)) return false;
  return true;
}
function applyMove(t, a, b){
  const top = t[a][t[a].length-1]; let n = 0;
  while (t[a].length && t[a][t[a].length-1] === top && t[b].length < CAP){ t[b].push(t[a].pop()); n++; }
  return n;
}
const isSolved = t => t.every(x => x.length === 0 || (x.length === CAP && x.every(c => c === x[0])));
const key = t => t.map(x => x.join('')).sort().join('|');

function solve(start, limit = 40000){ // DFS returns list of [a,b] moves or null
  const seen = new Set(); let nodes = 0;
  function dfs(t, path){
    if (isSolved(t)) return path;
    if (++nodes > limit) return null;
    const k = key(t); if (seen.has(k)) return null; seen.add(k);
    const opts = [];
    for (let a = 0; a < t.length; a++) for (let b = 0; b < t.length; b++) if (canMove(t,a,b)){
      let score = t[b].length ? 2 : 0; // prefer stacking on same colour
      if (t[a].length && t[a].every(c => c === t[a][0])) score += 1;
      opts.push([a,b,score]);
    }
    opts.sort((x,y) => y[2]-x[2]);
    for (const [a,b] of opts){
      const n = t.map(x => x.slice()); applyMove(n,a,b);
      const r = dfs(n, path.concat([[a,b]])); if (r) return r;
    }
    return null;
  }
  return dfs(start, []);
}

const colorsFor = lv => isYearly(lv) ? YEARLY_COLORS : isMonthly(lv) ? MONTHLY_COLORS : isWeekly(lv) ? WEEKLY_COLORS : isDaily(lv) ? DAILY_COLORS : Math.min(3 + Math.floor((lv - 1) / 2), COLORS.length);

function generate(lv){
  CAP = capFor(lv);
  const nColors = colorsFor(lv), nodeLimit = isYearly(lv) ? 600000 : isMonthly(lv) ? 200000 : 40000;
  const r = rng(isYearly(lv) ? (lv - YEARLY_MIN) * 7919 + 777001 : isMonthly(lv) ? (lv - MONTHLY_MIN) * 7919 + 424243 : isWeekly(lv) ? (lv - WEEKLY_MIN - DAILY_MIN) * 7919 + 99991 : isDaily(lv) ? (lv - DAILY_MIN) * 7919 + 13 : lv * 7919 + 13);
  for (let attempt = 0; attempt < 50; attempt++){
    const balls = [];
    for (let c = 0; c < nColors; c++) for (let i = 0; i < CAP; i++) balls.push(c);
    for (let i = balls.length - 1; i > 0; i--){ const j = Math.floor(r() * (i+1)); [balls[i],balls[j]] = [balls[j],balls[i]]; }
    const t = Array.from({length: nColors + 2}, () => []);
    balls.forEach((c,i) => t[i % nColors].push(c));
    if (t.slice(0,nColors).some(x => x.every(c => c === x[0]))) continue; // avoid trivially sorted tubes
    if (solve(t, nodeLimit)) return t;
  }
  throw new Error('could not generate level');
}

// Level timer: starts on the first move, stops when the level is solved, pauses while the tab is hidden
let tAcc = 0, tStart = null, tPaused = false;
const elapsedMs = () => tAcc + (tStart === null ? 0 : Date.now() - tStart);
const fmtTime = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const showTimer = () => { $('timer').textContent = fmtTime(elapsedMs()); };
function timerReset(){ tAcc = 0; tStart = null; tPaused = false; showTimer(); }
function timerStart(){ if (tStart === null && !tPaused) tStart = Date.now(); }
function timerStop(){ if (tStart !== null){ tAcc += Date.now() - tStart; tStart = null; } }
setInterval(showTimer, 250);
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ if (tStart !== null){ timerStop(); tPaused = true; } }
  else if (tPaused){ tPaused = false; tStart = Date.now(); }
});

function start(){
  timerReset();
  if (!isSpecial(level) && level > unlocked){ unlocked = level; try { localStorage.setItem('ballsortUnlocked', unlocked); } catch (e) {} }
  tubes = generate(level); history = []; selected = null; moves = 0; undos = 5; hints = 3; adds = 1; hintMove = null;
  render();
}

function render(){
  const board = $('board'); board.innerHTML = '';
  board.style.setProperty('--cap', CAP); board.classList.toggle('tall', CAP > 4 || tubes.length > 10);
  const sp = specialInfo(level); $('lvl').textContent = sp ? sp.icon + ' ' + sp.name + ' \u00B7 ' + sp.label : 'Level ' + level; $('moves').textContent = 'Moves: ' + moves + ' \u00B7 Best: ' + (best[level] ?? '\u2013');
  $('bestTime').textContent = bestTime[level] === undefined ? '\u2013' : fmtTime(bestTime[level]);
  $('undoB').textContent = undos; $('hintB').textContent = hints; $('addB').textContent = adds;
  tubes.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'tube' + (selected === i ? ' sel' : '') + (hintMove && hintMove[0] === i ? ' hint-from' : hintMove && hintMove[1] === i ? ' hint-to' : '') +
                   (t.length === CAP && t.every(c => c === t[0]) ? ' done' : '');
    t.forEach((c, k) => {
      const b = document.createElement('div');
      b.className = 'ball' + (selected === i && k === t.length - 1 ? ' lift' : '');
      b.style.setProperty('--c', COLORS[c][0]); b.style.setProperty('--d', COLORS[c][1]);
      el.appendChild(b);
    });
    el.onclick = () => tap(i);
    board.appendChild(el);
  });
}

function tap(i){
  hintMove = null;
  if (selected === null){ if (tubes[i].length) selected = i; }
  else if (selected === i){ selected = null; }
  else if (canMove(tubes, selected, i)){
    history.push(JSON.stringify(tubes)); applyMove(tubes, selected, i); moves++; selected = null;
    timerStart();
    render();
    if (isSolved(tubes)){ timerStop(); showTimer(); setTimeout(win, 350); } else moveSound();
    return;
  } else selected = tubes[i].length ? i : null;
  render();
}

function moveSound(){ // short soft "pop" as the ball lands
  if (muted) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(520, t);
    o.frequency.exponentialRampToValueAtTime(300, t + 0.09);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.13);
  } catch (e) {}
}

function winSound(){
  if (muted) return; // rising C-major arpeggio, synthesised so no audio file is needed
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + 0.02;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = t0 + i * 0.13;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (i === 3 ? 0.7 : 0.25));
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.75);
    });
  } catch (e) {}
}

// Leaderboard: top 10 runs per level, kept on this device (fewest moves, then fastest time)
let scores = [];
try { scores = JSON.parse(localStorage.getItem('ballsortScores')) || []; } catch (e) {}
let playerName = '';
try { playerName = localStorage.getItem('ballsortName') || ''; } catch (e) {}
let lastEntry = null;
const saveScores = () => { try { localStorage.setItem('ballsortScores', JSON.stringify(scores)); } catch (e) {} };
const byScore = (a, b) => a.m - b.m || a.t - b.t || a.d - b.d;
function addScore(lv, m, t){
  const entry = { n: playerName || 'Player', l: lv, m, t, d: Date.now() };
  scores.push(entry);
  const ranked = scores.filter(x => x.l === lv).sort(byScore);
  const drop = new Set(ranked.slice(10));
  scores = scores.filter(x => !drop.has(x));
  saveScores();
  const i = ranked.indexOf(entry);
  return { entry, rank: i < 10 ? i + 1 : 0 };
}
// World leaderboard (Supabase). The key below is a publishable key: it can only call the two leaderboard functions.
const SB_URL = 'https://tlituetpgrlfilqgkpvi.supabase.co';
const SB_KEY = 'sb_publishable_-25c7-mcGdSOcA1xsEqhxg_hDPwOv0t';
async function rpc(fn, body, keepalive){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, { method: 'POST', signal: ctl.signal, keepalive: !!keepalive,
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}
let pendingRun = null, lastRemoteId = null, boardTab = 'world', boardReq = 0;
async function submitRemote(keepalive){
  const run = pendingRun;
  if (!run || run.sent) return;
  run.sent = true;
  try {
    const sp = specialInfo(run.level), who = { p_name: playerName || 'Player', p_moves: run.moves, p_time_ms: run.time };
    const r = sp ? await rpc(sp.submit, Object.assign({ [sp.arg]: sp.date }, who), keepalive)
                 : await rpc('submit_score', Object.assign({ p_level: run.level }, who), keepalive);
    if (r && r.ok){
      lastRemoteId = r.id;
      run.rank = r.rank;
      if (pendingRun === run) $('worldMsg').textContent = '\u{1F30D} #' + r.rank + ' worldwide ' + (sp ? sp.when : 'on Level ' + run.level);
    }
  } catch (e) {
    run.sent = false;
  }
}
function setTab(t){
  boardTab = t;
  $('tabWorld').classList.toggle('on', t === 'world');
  $('tabLocal').classList.toggle('on', t === 'local');

function openBoard(lv){
  const sel = $('boardLevel'), max = Math.max(unlocked, normalLevel), today = dailyKey();
  sel.innerHTML = '';
  const oy = document.createElement('option'); oy.value = yearKey(); oy.textContent = '\u{1F3C6} Yearly challenge (this year)'; sel.appendChild(oy);
  const om = document.createElement('option'); om.value = monthKey(); om.textContent = '\u{1F3C5} Monthly challenge (this month)'; sel.appendChild(om);
  const ow = document.createElement('option'); ow.value = weekKey(); ow.textContent = '\u{1F5D3} Weekly challenge (this week)'; sel.appendChild(ow);
  const od = document.createElement('option'); od.value = today; od.textContent = '\u{1F4C5} Daily challenge (today)'; sel.appendChild(od);

  sel.value = isYearly(want) ? yearKey() : isMonthly(want) ? monthKey() : isWeekly(want) ? weekKey() : isDaily(want) ? today : want;

  $('lbModal').classList.add('show');
}
function boardMessage(text){
  const list = $('boardList'); list.innerHTML = '';
  const li = document.createElement('li'); li.className = 'board-empty'; li.style.display = 'block'; li.textContent = text; list.appendChild(li);
}
function renderWorld(){
  const lv = +$('boardLevel').value, tok = ++boardReq, list = $('boardList');
  boardMessage('Loading\u2026');
  const sp = specialInfo(lv);
  (sp ? rpc(sp.get, { [sp.arg]: sp.date, p_limit: 20 }) : rpc('get_leaderboard', { p_level: lv, p_limit: 20 })).then(rows => {
    if (tok !== boardReq) return;
    if (!rows.length){ boardMessage('No scores yet \u2013 be the first on the world board!'); return; }
    list.innerHTML = '';
    rows.forEach(r => {
      const li = document.createElement('li'); if (r.id === lastRemoteId) li.className = 'me';
      const rk = document.createElement('span'); rk.textContent = '#' + r.rank;
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.name;

      li.append(rk, nm, sc); list.appendChild(li);

    if (tok === boardReq) boardMessage("Couldn't reach the world leaderboard. Check your connection, or look at 'This device'.");
  });
}
function renderBoard(){
  if (boardTab === 'world'){ renderWorld(); return; }
  const lv = +$('boardLevel').value, list = $('boardList');
  list.innerHTML = '';
  const rows = scores.filter(x => x.l === lv).sort(byScore);
  if (!rows.length){
    const li = document.createElement('li'); li.className = 'board-empty'; li.style.display = 'block';
    li.textContent = 'No scores yet \u2013 finish this level to get on the board!'; list.appendChild(li); return;
  }
  rows.forEach((r, i) => {
    const li = document.createElement('li'); if (r === lastEntry) li.className = 'me';
    const rk = document.createElement('span'); rk.textContent = '#' + (i + 1);
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.n;
    const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = r.m + ' moves \u00B7 ' + fmtTime(r.t);
    li.append(rk, nm, sc); list.appendChild(li);
  });
}
function closeBoard(){ $('lbModal').classList.remove('show'); }

function win(){
  winSound();
  const prev = best[level];
  const isBest = prev === undefined || moves < prev;
  if (isBest){ best[level] = moves; saveBest(); }
  timerStop(); showTimer();
  const time = elapsedMs(), prevTime = bestTime[level];
  const isBestTime = prevTime === undefined || time < prevTime;
  if (isBestTime){ bestTime[level] = time; saveBestTime(); }
  $('winTime').textContent = 'Time ' + fmtTime(time) +
    (isBestTime ? (prevTime === undefined ? ' \u2013 best time set!' : ' \u2013 new best time! (was ' + fmtTime(prevTime) + ')') : ' \u00B7 Best: ' + fmtTime(prevTime));
  $('bestTime').textContent = fmtTime(bestTime[level]);
  $('winMsg').textContent = 'Solved in ' + moves + ' moves' +
    (isBest ? (prev === undefined ? ' \u2013 best score set!' : ' \u2013 new best! (was ' + prev + ')') : ' \u00B7 Best: ' + prev);
  const sp = specialInfo(level), daily = isDaily(level), weekly = isWeekly(level), monthly = isMonthly(level), yearly = isYearly(level), special = !!sp;
  $('next').textContent = special ? 'Back to levels' : 'Next Level';
  if (special){ try { localStorage.setItem(sp.done, level); } catch (e) {} }
  const n = colorsFor(level + 1), harder = n > colorsFor(level);
  if (daily){
    const added = recordDaily(level), n = currentStreak();
    $('nextHint').textContent = '\u{1F525} ' + (added ? n + '-day streak!' : 'Streak: ' + n + (n === 1 ? ' day.' : ' days.')) +
      (streak.best > n ? ' (best ' + streak.best + ')' : '') + ' Come back tomorrow to keep it going.';
    refreshDailyLabels();
  }
  else if (yearly) $('nextHint').textContent = '\u{1F3C6} A new yearly challenge starts on January 1st (UTC).';
  else if (monthly) $('nextHint').textContent = '\u{1F3C5} A new monthly challenge starts on the 1st of every month (UTC).';
  else if (weekly) $('nextHint').textContent = '\u{1F5D3} A new weekly challenge starts every Monday (UTC).';
  else $('nextHint').textContent = '\u{1F4A1} Level ' + (level + 1) + ': ' + n + ' colors, ' + (n + 2) + ' tubes' +
    (harder ? ' \u2013 a new color joins!' : n === COLORS.length ? ' \u2013 the maximum difficulty' : ' \u2013 same colors, a new layout');
  const res = addScore(level, moves, time);
  lastEntry = res.entry;
  $('rankMsg').textContent = res.rank ? '\u{1F3C6} #' + res.rank + (sp ? ' on ' + sp.board : ' on the Level ' + level + ' leaderboard') : 'Not in the top 10 ' + (sp ? 'for ' + sp.when : 'for this level');
  $('shareBtn').style.display = special ? '' : 'none';
  $('shareBtn').textContent = 'Share';
  $('playerName').value = playerName;
  $('worldMsg').textContent = '';
  pendingRun = { level, moves, time: Math.round(time), sent: false };
  $('win').classList.add('show');
}

};

const PUBLIC_URL = 'https://warunkash.github.io/Development_FullStackTestVarun/ballsort/';
function dailyShareText(run){
  const n = currentStreak();
  return [
    'Ball Sort ' + specialInfo(run.level).name + ' \u00B7 ' + specialInfo(run.level).shareLabel,
    specialInfo(run.level).icon + ' ' + run.moves + ' moves \u00B7 ' + fmtTime(run.time),

    n && isDaily(run.level) ? '\u{1F525} ' + n + '-day streak' : '',
    PUBLIC_URL
  ].filter(Boolean).join('\n');
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:-100px;opacity:0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
$('shareBtn').onclick = async () => {
  const run = pendingRun, btn = $('shareBtn');
  if (!run || !isSpecial(run.level)) return;
  if (!run.sent) await Promise.race([submitRemote(), new Promise(r => setTimeout(r, 2500))]);
  const text = dailyShareText(run);
  if (navigator.share){
    try { await navigator.share({ title: 'Ball Sort ' + specialInfo(run.level).name, text }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const ok = await copyText(text);
  btn.textContent = ok ? '\u2713 Copied!' : "Couldn't copy";
  setTimeout(() => { if (btn.textContent !== 'Share') btn.textContent = 'Share'; }, 2000);
};
